<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan Bulanan</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="shared.css">
<style>
  form#form { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form#form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--soft); padding: 4px; border-radius: 14px; }
  .toggle input { display: none; }
  form#form .toggle label { text-align: center; padding: 10px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 11px; display: block; }
  form#form #t-out:checked + label { background: #c2410c; color: #fff; }
  form#form #t-in:checked + label { background: #15803d; color: #fff; }

  .bars { display: grid; gap: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; }
  .bar .isi { flex: 1; min-width: 0; }
  .bar .atas { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .bar .atas span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .atas span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar .track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 5px; }
  .bar .track span { display: block; height: 100%; border-radius: 4px; }

  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  #list li:first-child { border-top: 0; }
  #list .info { flex: 1; min-width: 0; }
  #list .info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  #list .info small { color: var(--muted); }
  #list .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  #list .del { background: none; color: var(--muted); padding: 4px 6px; font-size: 18px; font-weight: 400; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tools .full { grid-column: 1 / -1; }
  #kembali { width: 100%; margin-top: 8px; padding: 6px; font-size: 13px; background: none; color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>💰 Keuangan Bulanan</h1>
</header>

<nav class="subnav" aria-label="Halaman keuangan">
  <a href="./" aria-current="page">Laporan</a>
  <a href="budget/">Budget</a>
  <a href="networth/">Net Worth</a>
</nav>

<main>
  <section class="card" aria-label="Pilih periode">
    <div class="periode">
      <button type="button" id="prev" aria-label="Periode sebelumnya">‹</button>
      <div class="label"><b id="p-nama">Oktober 2026</b><span id="p-rentang"></span></div>
      <button type="button" id="next" aria-label="Periode berikutnya">›</button>
    </div>
    <button type="button" id="kembali" hidden>Kembali ke periode sekarang</button>
  </section>

  <section class="hero" aria-label="Ringkasan periode">
    <small>Saldo periode ini</small>
    <div class="angka" id="s-saldo">Rp 0</div>
    <div class="sub" id="s-hari"></div>
    <div class="meter" id="s-meter" aria-hidden="true"><span style="width:0"></span></div>
    <div class="tiles">
      <div class="tile"><small>⬇️ Pemasukan</small><b id="s-in">Rp 0</b></div>
      <div class="tile"><small>⬆️ Pengeluaran</small><b id="s-out">Rp 0</b></div>
    </div>
  </section>

  <section class="card">
    <h2>Catat transaksi</h2>
    <form id="form">
      <div class="toggle">
        <input type="radio" name="jenis" id="t-out" value="keluar" checked><label for="t-out">Pengeluaran</label>
        <input type="radio" name="jenis" id="t-in" value="masuk"><label for="t-in">Pemasukan</label>
      </div>
      <label>Jumlah (Rp)
        <input id="jumlah" inputmode="numeric" placeholder="contoh: 25.000" required autocomplete="off">
      </label>
      <div class="row">
        <label>Kategori <select id="kategori"></select></label>
        <label>Tanggal <input type="date" id="tanggal" required></label>
      </div>
      <label>Catatan
        <input id="catatan" placeholder="opsional" autocomplete="off">
      </label>
      <button type="submit">Simpan</button>
    </form>
  </section>

  <section class="card">
    <h2>Pengeluaran per kategori</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card">
    <h2>Transaksi</h2>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <h2>⚙️ Periode gajian</h2>
    <div class="form-grid">
      <label class="field">Tanggal gajian (awal periode)
        <select id="mulai"></select>
      </label>
      <p class="hint" id="mulai-hint"></p>
    </div>
  </section>

  <section class="card">
    <h2>Data</h2>
    <div class="tools">
      <button class="ghost full" id="csv">Unduh laporan periode ini (CSV / Excel)</button>
      <button class="ghost" id="backup">Backup data</button>
      <button class="ghost" id="restore">Pulihkan backup</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </section>
</main>

<script src="shared.js"></script>
<script>
const KEY = 'keuangan-bulanan-v1';
const KATEGORI = Keu.KATEGORI;   // shared with the Budget page

const $ = (id) => document.getElementById(id);
const rupiah = Keu.rupiah;
const today = Keu.hariIni;

let data = load();
let periode = Keu.periodeIni();   // "YYYY-MM" = the month the shown pay period starts in

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function jenis() {
  return document.querySelector('input[name=jenis]:checked').value;
}
function isiKategori() {
  $('kategori').innerHTML = KATEGORI[jenis()].map(k => `<option value="${k}">${Keu.metaKategori(k, jenis()).ikon} ${k}</option>`).join('');
}

const escapeHtml = Keu.escapeHtml;

function transaksiPeriode() {
  return data.filter(t => t && typeof t.tanggal === 'string' && Keu.periodeDari(t.tanggal) === periode)
             .sort((a, b) => b.tanggal.localeCompare(a.tanggal) || b.id - a.id);
}

function renderPeriode() {
  $('p-nama').textContent = Keu.namaBulan(periode);
  $('p-rentang').textContent = Keu.labelRentang(periode);
  $('kembali').hidden = periode === Keu.periodeIni();

  const pos = Keu.posisiHari(periode);
  const gajian = Keu.mulaiPeriode() > 1;
  const { akhir } = Keu.rentangPeriode(periode);
  $('s-hari').textContent =
    pos.status === 'belum' ? 'Periode ini belum dimulai'
    : pos.status === 'selesai' ? `Periode selesai · ${pos.total} hari`
    : `Hari ke-${pos.hariKe} dari ${pos.total} · ${pos.sisa ? `${pos.sisa} hari lagi` : 'hari terakhir'}`
      + (pos.sisa ? (gajian ? ' menuju gajian' : ` (s.d. ${Keu.tanggalPendek(akhir)})`) : '');
  $('s-meter').firstElementChild.style.width = `${pos.hariKe / pos.total * 100}%`;
}

function render() {
  renderPeriode();
  const list = transaksiPeriode();
  const masuk = list.filter(t => t.jenis === 'masuk').reduce((s, t) => s + t.jumlah, 0);
  const keluar = list.filter(t => t.jenis === 'keluar').reduce((s, t) => s + t.jumlah, 0);
  $('s-in').textContent = rupiah(masuk);
  $('s-out').textContent = rupiah(keluar);
  $('s-saldo').textContent = rupiah(masuk - keluar);

  const perKat = {};
  list.filter(t => t.jenis === 'keluar').forEach(t => perKat[t.kategori] = (perKat[t.kategori] || 0) + t.jumlah);
  const urut = Object.entries(perKat).sort((a, b) => b[1] - a[1]);
  $('bars').innerHTML = urut.length
    ? urut.map(([k, v]) => {
        const { ikon, warna } = Keu.metaKategori(k);
        return `<div class="bar"><span class="ikon" style="--warna:${warna}">${ikon}</span><div class="isi">
          <div class="atas"><span>${escapeHtml(k)}</span><span>${rupiah(v)} · ${Math.round(v / keluar * 100)}%</span></div>
          <div class="track"><span style="width:${v / urut[0][1] * 100}%;background:${warna}"></span></div></div></div>`;
      }).join('')
    : '<p class="empty">Belum ada pengeluaran di periode ini.</p>';

  $('list').innerHTML = list.length
    ? list.map(t => {
        const { ikon, warna } = Keu.metaKategori(t.kategori, t.jenis);
        return `<li>
        <span class="ikon" style="--warna:${warna}">${ikon}</span>
        <div class="info"><b>${escapeHtml(t.catatan || t.kategori)}</b>
          <small>${Keu.tanggalPendek(t.tanggal)} · ${escapeHtml(t.kategori)}</small></div>
        <span class="amt ${t.jenis === 'masuk' ? 'in' : 'out'}">${t.jenis === 'masuk' ? '+' : '−'}${rupiah(t.jumlah)}</span>
        <button class="del" data-id="${t.id}" aria-label="Hapus">×</button>
      </li>`;
      }).join('')
    : '<li><p class="empty" style="width:100%">Belum ada transaksi di periode ini.</p></li>';
}

// ---- Pay period setting ----
function renderPengaturan() {
  const mulai = Keu.mulaiPeriode();
  $('mulai').innerHTML = Array.from({ length: 31 }, (_, i) => i + 1)
    .map(d => `<option value="${d}"${d === mulai ? ' selected' : ''}>${d === 1 ? '1 (per bulan kalender)' : `Tanggal ${d}`}</option>`).join('');
  $('mulai-hint').textContent = mulai === 1
    ? 'Laporan dihitung per bulan kalender (tanggal 1 sampai akhir bulan). Pilih tanggal gajian Anda kalau ingin laporan dihitung dari gajian ke gajian.'
    : `Periode dihitung dari tanggal ${mulai} sampai sehari sebelum tanggal ${mulai} bulan berikutnya, `
      + `contoh: ${Keu.labelRentang(Keu.periodeIni())}.` + (mulai > 28 ? ' Di bulan yang lebih pendek, periode mulai di hari terakhir bulan itu.' : '');
}

$('mulai').addEventListener('change', () => {
  if (!Keu.savePengaturan({ mulai: Number($('mulai').value) })) return;
  periode = Keu.periodeIni();
  renderPengaturan();
  render();
});

$('prev').addEventListener('click', () => { periode = Keu.bulanSebelum(periode); render(); });
$('next').addEventListener('click', () => { periode = Keu.bulanBerikut(periode); render(); });
$('kembali').addEventListener('click', () => { periode = Keu.periodeIni(); render(); });

// ---- Transactions ----
// Format the amount field with thousand separators while typing.
$('jumlah').addEventListener('input', e => {
  const angka = e.target.value.replace(/\D/g, '');
  e.target.value = angka ? Number(angka).toLocaleString('id-ID') : '';
});

document.querySelectorAll('input[name=jenis]').forEach(r => r.addEventListener('change', isiKategori));

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const jumlah = Number($('jumlah').value.replace(/\D/g, ''));
  if (!jumlah) return $('jumlah').focus();
  data.push({
    id: Date.now(),
    jenis: jenis(),
    jumlah,
    kategori: $('kategori').value,
    tanggal: $('tanggal').value,
    catatan: $('catatan').value.trim()
  });
  save();
  periode = Keu.periodeDari($('tanggal').value);
  $('jumlah').value = '';
  $('catatan').value = '';
  render();
});

$('list').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id || !confirm('Hapus transaksi ini?')) return;
  data = data.filter(t => t.id !== Number(id));
  save();
  render();
});

// ---- Export, backup, restore ----
function unduh(nama, isi, tipe) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([isi], { type: tipe }));
  a.download = nama;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('csv').addEventListener('click', () => {
  const list = transaksiPeriode().reverse();
  const sel = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const baris = [['Tanggal', 'Jenis', 'Kategori', 'Catatan', 'Jumlah'].join(';')];
  list.forEach(t => baris.push([t.tanggal, t.jenis === 'masuk' ? 'Pemasukan' : 'Pengeluaran', sel(t.kategori), sel(t.catatan), t.jenis === 'masuk' ? t.jumlah : -t.jumlah].join(';')));
  const masuk = list.filter(t => t.jenis === 'masuk').reduce((s, t) => s + t.jumlah, 0);
  const keluar = list.filter(t => t.jenis === 'keluar').reduce((s, t) => s + t.jumlah, 0);
  baris.push('', `;;;Periode;${sel(Keu.labelRentang(periode))}`,
    `;;;Total pemasukan;${masuk}`, `;;;Total pengeluaran;${-keluar}`, `;;;Saldo;${masuk - keluar}`);
  // BOM so Excel reads the file as UTF-8; ';' is the list separator in Indonesian locale.
  unduh(`laporan-${periode}.csv`, '﻿' + baris.join('\r\n'), 'text/csv');
});

// Backup includes transactions, budget, net worth snapshots and the pay-period setting.
$('backup').addEventListener('click', () => {
  unduh(`backup-keuangan-${today()}.json`, JSON.stringify(Keu.buatBackup(data), null, 2), 'application/json');
});

$('restore').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const isi = Keu.bacaBackup(JSON.parse(await f.text()));
    const lama = isi.budget === null;
    const pesan = lama
      ? `Backup lama ini hanya berisi transaksi.\nGanti transaksi sekarang dengan ${isi.transaksi.length} transaksi dari backup?\n(Budget dan net worth tidak berubah.)`
      : `Ganti SEMUA data sekarang dengan isi backup?\n• ${isi.transaksi.length} transaksi\n• ${Object.keys(isi.budget).length} bulan budget\n• ${isi.networth.length} snapshot net worth`
        + (isi.pengaturan ? '\n• pengaturan periode gajian' : '');
    if (!confirm(pesan)) return;
    data = isi.transaksi;
    save();
    if (!lama) {
      Keu.saveBudget(isi.budget);
      Keu.saveNetworth(isi.networth);
    }
    if (isi.pengaturan) Keu.savePengaturan(isi.pengaturan);
    periode = Keu.periodeIni();
    renderPengaturan();
    render();
  } catch {
    alert('File backup tidak valid.');
  } finally {
    e.target.value = '';
  }
});

$('tanggal').value = today();
isiKategori();
renderPengaturan();
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
